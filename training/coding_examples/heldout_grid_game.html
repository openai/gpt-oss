<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>九宮移籌</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #f4ecd8; color: #332a1e; font-family: serif; }
  main { width: min(28rem, 92vw); text-align: center; }
  #board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.4rem; }
  button { aspect-ratio: 1; font: inherit; font-size: 1.5rem; border: 1px solid #8b6f47;
           background: #fffaf0; color: inherit; touch-action: manipulation; }
  button:disabled { opacity: 0.35; }
  #notice { min-height: 1.5rem; margin-top: 1rem; }
</style>
</head>
<body>
<main>
  <h1>九宮移籌</h1>
  <div id="board" aria-label="九宮棋盤"></div>
  <p><button id="reset" type="button">重局</button></p>
  <p id="notice" aria-live="polite">移鄰籌入虛位。</p>
</main>
<script>
  // 今世 JavaScript；開局自勝局逆行合法步，故必可解。
  const solved = [1, 2, 3, 4, 5, 6, 7, 8, 0];
  const neighbors = [
    [1, 3], [0, 2, 4], [1, 5],
    [0, 4, 6], [1, 3, 5, 7], [2, 4, 8],
    [3, 7], [4, 6, 8], [5, 7],
  ];
  const board = document.querySelector("#board");
  const notice = document.querySelector("#notice");
  let tiles = solved.slice();

  function draw() {
    board.replaceChildren();
    tiles.forEach((value, index) => {
      const cell = document.createElement("button");
      cell.type = "button";
      cell.textContent = value === 0 ? "" : String(value);
      cell.disabled = value === 0;
      cell.addEventListener("click", () => move(index));
      board.append(cell);
    });
    notice.textContent = tiles.every((value, index) => value === solved[index])
      ? "順序既復，勝局也。" : "移鄰籌入虛位。";
  }

  function move(index) {
    const blank = tiles.indexOf(0);
    if (!neighbors[blank].includes(index)) return;
    [tiles[blank], tiles[index]] = [tiles[index], tiles[blank]];
    draw();
  }

  function reset() {
    tiles = solved.slice();
    for (let step = 0; step < 24; step += 1) {
      const blank = tiles.indexOf(0);
      const options = neighbors[blank];
      move(options[step % options.length]);
    }
    if (tiles.every((value, index) => value === solved[index])) return reset();
    draw();
  }

  document.querySelector("#reset").addEventListener("click", reset);
  reset();
</script>
</body>
</html>
